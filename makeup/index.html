<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff0f5"><title>반짝 메이크업 스튜디오</title>
<style>
:root{--pink:#e98eae;--deep:#985875;--ink:#593d4c;--line:#f1dce5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 5%,#ffe2ed,transparent 30%),linear-gradient(135deg,#fff9f5,#fbeaf3);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}header{text-align:center;padding:28px 15px 15px}.eyebrow{font-size:11px;letter-spacing:3px;color:#bd7895;font-weight:800}h1{font-size:clamp(28px,5vw,42px);margin:8px 0;color:#9b5878}header p{margin:0;color:#987b89}main{max-width:1060px;margin:auto;padding:12px 16px 35px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#ffffffdf;border:1px solid white;border-radius:24px;padding:20px;box-shadow:0 14px 40px #b77b9418}.stage{min-height:610px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#fff0f6,#fff9f2);position:relative;overflow:hidden}.stage:before,.stage:after{content:"✦";position:absolute;color:#efb2c8;font-size:24px}.stage:before{top:24px;left:28px}.stage:after{right:30px;bottom:28px}.stage-title{align-self:flex-start;font-size:13px;font-weight:800;color:#b47791}#avatar{width:min(100%,390px);height:auto;filter:drop-shadow(0 14px 10px #c38ba633)}.mood{font-size:13px;color:#a27d8e;margin-top:3px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}button{font:inherit;cursor:pointer;transition:.15s}button:hover{transform:translateY(-2px)}button:focus-visible{outline:3px solid #d77fa5;outline-offset:3px}.action{padding:10px 14px;border-radius:13px;background:white;border:1px solid var(--line);color:var(--deep);font-weight:700}.primary{background:linear-gradient(135deg,#ee9fbb,#d97fa4);color:white;border:0}.editor h2{font-size:20px;margin:2px 0 5px}.sub{font-size:13px;color:#a08793;margin:0 0 16px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:18px}.tab{padding:10px 3px;border-radius:12px;background:#fff3f7;color:#a36b84;font-size:12px;font-weight:800;border:1px solid transparent}.tab[aria-selected=true]{background:#e99bb7;color:white}.label{font-size:13px;font-weight:800;margin:16px 0 10px;color:#8f6177}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.choice{background:white;border:1px solid var(--line);border-radius:14px;padding:10px 4px;color:#755568;font-size:12px;min-height:72px}.swatch{display:block;width:29px;height:29px;border-radius:50%;margin:0 auto 6px;border:3px solid white;box-shadow:0 0 0 1px #ead6df}.choice[aria-pressed=true]{border:2px solid #df86a8;background:#fff5f8}.hint{margin-top:18px;padding:12px 14px;background:#fff5f8;border-radius:13px;color:#94657c;font-size:13px;line-height:1.5}.editor{align-self:start}footer{text-align:center;color:#b18b9d;font-size:12px;padding:0 15px 22px}@media(max-width:760px){main{grid-template-columns:1fr;padding:8px 12px 25px;gap:13px}.stage{min-height:520px}.panel{padding:16px}}@media(max-width:360px){.tabs{grid-template-columns:repeat(3,1fr)}.choices{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header><div class="eyebrow">✦ YOUR LITTLE BEAUTY PLAYGROUND ✦</div><h1>반짝 메이크업 스튜디오</h1><p>메이크업부터 헤어와 패션까지, 나만의 스타일을 완성해 봐!</p></header>
<main><section class="panel stage" aria-label="메이크업 미리보기"><div class="stage-title">MY MAKEOVER ✨</div>
<svg id="avatar" viewBox="0 0 360 510" role="img" aria-label="헤어와 메이크업, 옷을 꾸밀 수 있는 캐릭터">
<defs>
 <linearGradient id="skin" x2=".2" y2="1"><stop stop-color="#ffe7d7"/><stop offset=".55" stop-color="#f7cfb9"/><stop offset="1" stop-color="#eab49e"/></linearGradient>
 <linearGradient id="hair" x2="1" y2="1"><stop stop-color="#765064"/><stop offset="1" stop-color="#382b3c"/></linearGradient>
 <linearGradient id="cloth" x2="0" y2="1"><stop stop-color="#f5b9cf"/><stop offset="1" stop-color="#c9789d"/></linearGradient>
 <radialGradient id="shine"><stop stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<ellipse cx="180" cy="488" rx="112" ry="13" fill="#e8cbd7" opacity=".55"/>
<!-- back hair -->
<path d="M83 195Q55 55 180 35Q306 52 279 205L274 330Q260 382 226 393L130 393Q93 365 86 315Z" fill="url(#hair)"/>
<!-- shoulders and clothing, clearly separated from neck -->
<path d="M119 342Q91 350 69 383Q48 418 42 490L318 490Q311 417 290 383Q269 350 241 342L215 333L145 333Z" fill="url(#cloth)" stroke="#a85f83" stroke-width="2"/>
<path d="M139 335Q180 369 221 335L246 354Q222 392 180 394Q138 392 114 354Z" fill="#fff0f5" stroke="#d99ab5" stroke-width="2"/>
<path d="M146 353Q180 379 214 353L201 490H159Z" fill="#fff8fa" opacity=".88"/>
<path d="M180 394V485" stroke="#e4a6be" stroke-width="2" opacity=".8"/>
<circle cx="180" cy="414" r="3" fill="#c47b9a"/><circle cx="180" cy="438" r="3" fill="#c47b9a"/><circle cx="180" cy="462" r="3" fill="#c47b9a"/>
<!-- neck -->
<path d="M148 286L148 350Q180 375 212 350L212 286Z" fill="url(#skin)" stroke="#d99f8d" stroke-width="1.2"/>
<path d="M149 322Q180 345 211 322" fill="none" stroke="#d69b8a" stroke-width="2" opacity=".45"/>
<!-- ears -->
<ellipse cx="99" cy="224" rx="15" ry="24" fill="url(#skin)" stroke="#dfaa98"/><ellipse cx="261" cy="224" rx="15" ry="24" fill="url(#skin)" stroke="#dfaa98"/>
<!-- face: balanced oval -->
<path d="M99 169Q101 99 180 91Q259 99 261 169L252 251Q242 310 180 321Q118 310 108 251Z" fill="url(#skin)" stroke="#e7b5a2" stroke-width="1"/>
<!-- face highlights -->
<ellipse cx="145" cy="166" rx="26" ry="47" fill="url(#shine)" opacity=".38"/>
<!-- fringe and hair framing -->
<path d="M91 184Q69 89 144 57Q218 28 269 112Q278 137 268 181Q250 145 230 130Q190 151 148 130Q120 123 103 160Z" fill="url(#hair)"/>
<path d="M103 150Q130 116 153 122Q180 132 201 126Q229 117 250 143Q219 139 197 145Q154 157 121 143Z" fill="#805a70" opacity=".55"/>
<path d="M95 164Q75 225 101 287Q109 305 119 311L112 205Z M265 164Q285 225 259 287Q251 305 241 311L248 205Z" fill="#493449"/>
<!-- brows -->
<g id="brows"><path d="M119 190Q139 176 158 190M202 190Q221 176 241 190" fill="none" stroke="#694858" stroke-width="5" stroke-linecap="round"/></g>
<!-- shadow, liner, eyes -->
<g id="eyeshadow"></g><g id="liner"></g>
<g id="eyes"><path d="M116 214Q138 194 160 214Q140 239 116 214ZM200 214Q222 194 244 214Q220 239 200 214Z" fill="#fffdfb"/><ellipse cx="139" cy="215" rx="9" ry="12" fill="#80604f"/><ellipse cx="221" cy="215" rx="9" ry="12" fill="#80604f"/><ellipse cx="139" cy="215" rx="5" ry="8" fill="#392b32"/><ellipse cx="221" cy="215" rx="5" ry="8" fill="#392b32"/><circle cx="142" cy="210" r="3" fill="white"/><circle cx="224" cy="210" r="3" fill="white"/><path d="M116 214Q138 194 160 214M200 214Q222 194 244 214" fill="none" stroke="#684655" stroke-width="2.5"/></g>
<g id="lashes"></g><g id="lens"></g>
<!-- nose and blush -->
<g id="blush"></g><g id="highlight"></g>
<path d="M180 222Q168 255 177 260Q183 263 189 256" fill="none" stroke="#d69b8a" stroke-width="2.5" stroke-linecap="round"/>
<path d="M172 266Q180 270 188 266" fill="none" stroke="#d99e91" stroke-width="1.5" opacity=".6"/>
<g id="lips"><path d="M155 286Q168 274 180 282Q192 274 205 286Q194 305 180 304Q166 305 155 286Z" fill="#ca7187"/><path d="M162 287Q180 292 198 287" fill="none" stroke="#f8b7bf" stroke-width="2"/><path d="M169 298Q180 302 191 298" fill="none" stroke="#a9516b" stroke-width="1" opacity=".5"/></g>
<g id="freckles"></g><g id="accessory"></g>
<!-- neckline jewelry -->
<g id="necklace"><path d="M145 347Q180 379 215 347" fill="none" stroke="#d6ad70" stroke-width="2"/><path d="M180 367L175 374L180 381L185 374Z" fill="#f8dfaa" stroke="#c69c62"/></g>
</svg>
<div class="mood" id="look-name">새로운 스타일을 골라봐요</div><div class="toolbar"><button class="action" id="random">🎲 랜덤 룩</button><button class="action" id="reset">↺ 처음으로</button><button class="action primary" id="finish">완성했어요! ✨</button></div></section>
<section class="panel editor"><h2>뷰티 & 스타일 아이템</h2><p class="sub">카테고리를 바꾸고 다양한 아이템을 조합해 보세요.</p>
<div class="tabs" role="tablist" aria-label="꾸미기 종류">
<button class="tab" role="tab" aria-selected="true" data-tab="lip">💄 립</button><button class="tab" role="tab" aria-selected="false" data-tab="blush">🌸 블러셔</button><button class="tab" role="tab" aria-selected="false" data-tab="eye">🎨 섀도</button><button class="tab" role="tab" aria-selected="false" data-tab="liner">🖊️ 아이라인</button><button class="tab" role="tab" aria-selected="false" data-tab="lashes">✨ 속눈썹</button><button class="tab" role="tab" aria-selected="false" data-tab="brows">✍️ 눈썹</button><button class="tab" role="tab" aria-selected="false" data-tab="lens">👁️ 렌즈</button><button class="tab" role="tab" aria-selected="false" data-tab="hair">🎀 헤어</button><button class="tab" role="tab" aria-selected="false" data-tab="highlight">💫 하이라이터</button><button class="tab" role="tab" aria-selected="false" data-tab="accessory">💎 액세서리</button><button class="tab" role="tab" aria-selected="false" data-tab="cloth">👗 의상</button><button class="tab" role="tab" aria-selected="false" data-tab="necklace">📿 목걸이</button>
</div><div id="options"></div><div class="hint" id="hint" aria-live="polite">마음에 드는 아이템을 선택해 봐! 정답은 없으니 네 취향대로 완성하면 돼 💗</div></section></main><footer>MAKE YOUR OWN SPARKLE · 나만의 스타일을 즐겨봐요</footer>
<script>
const palettes={
lip:[['체리 핑크','#d85d83'],['로즈','#b94e70'],['코랄','#ed826e'],['플럼','#98516f'],['피치','#ef9b91'],['베리','#bd4770'],['누드','#c9857e'],['라일락','#bd8eae'],['레드','#c94359'],['모브','#aa718e'],['글로스','#f2a6b5'],['브릭','#a94e55']],
blush:[['베이비 핑크','#f28fa8'],['살구','#f4a27e'],['로즈','#df7891'],['라벤더','#c39acb'],['피치','#f5b49c'],['코랄','#ed7e79'],['모브','#bd849e'],['소프트','#e9a9b3'],['플럼 핑크','#c76f96'],['누드 피치','#d99a83']],
eye:[['샴페인','#e9c88d'],['핑크 펄','#e9a5c0'],['라벤더','#b995ca'],['브론즈','#ad765e'],['민트','#9bc9b9'],['로즈 골드','#d89a91'],['스카이','#9dbbdf'],['초코','#79566a'],['실버','#c5c9d6'],['코랄','#e99a87'],['버건디','#9e596f'],['골드 글리터','#e3b95e']],
liner:[['소프트 브라운','#76515a'],['딥 블랙','#302632'],['플럼','#80506e'],['네이비','#465b82'],['그린','#567b70'],['그레이','#777985']],
lashes:[['내추럴','#674b55'],['또렷하게','#302632'],['롱 래쉬','#49303f'],['브라운 래쉬','#886050']],
brows:[['내추럴 브라운','#805c50'],['다크 브라운','#533a3b'],['애쉬 브라운','#8a7776'],['소프트 블랙','#40333a'],['코코아','#9b7161']],
lens:[['초코 브라운','#8a654c'],['올리브','#74846a'],['그레이','#8d9ba2'],['블루','#6e91b5'],['헤이즐','#aa8055'],['라벤더','#9b82b5'],['내추럴','#765b4c']],
hair:[['초코 브라운','#68445a'],['블랙','#302632'],['허니 브라운','#b47b50'],['로즈 브라운','#a96b7d'],['라벤더','#9a7aab'],['코퍼','#bc704f'],['애쉬','#88818c'],['핑크','#d88cae'],['밀크티','#c49b83'],['체리','#873f59']],
highlight:[['샴페인','#fff0c5'],['펄 핑크','#f7c7dc'],['골드','#efd18b'],['실버','#e2e5f1'],['라벤더','#e2c9f4']],
accessory:[['진주 귀걸이','#f5e6dc'],['골드 링','#d5ad70'],['핑크 리본','#e88fb3'],['별 장식','#f2cf79'],['꽃 장식','#e9a0b6'],['하트 핀','#e8799e']],
cloth:[['로즈 드레스','#d98baa'],['라벤더 드레스','#a994c9'],['민트 드레스','#8ebcae'],['크림 블라우스','#e8d8c8'],['블루 드레스','#8ca9ce'],['블랙 원피스','#514253'],['피치 드레스','#e9a38f'],['레드 드레스','#b84e64']],
necklace:[['골드 목걸이','#d6ad70'],['진주 목걸이','#f1e3d4'],['리본 초커','#d982a5'],['실버 목걸이','#b8c2d4'],['하트 펜던트','#e8a0b5']]
};
const labels={lip:'립 컬러',blush:'블러셔 컬러',eye:'아이섀도',liner:'아이라인',lashes:'속눈썹',brows:'눈썹 컬러',lens:'렌즈 컬러',hair:'헤어 컬러',highlight:'하이라이터',accessory:'액세서리',cloth:'의상',necklace:'목걸이'};
const state=Object.fromEntries(Object.keys(palettes).map(k=>[k,null]));
const options=document.getElementById('options'),hint=document.getElementById('hint');let tab='lip';
function render(){document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));options.innerHTML='<div class="label">'+labels[tab]+' 선택</div><div class="choices">'+palettes[tab].map((v,i)=>'<button class="choice" data-index="'+i+'" aria-pressed="'+(state[tab]===i)+'"><span class="swatch" style="background:'+v[1]+'"></span>'+v[0]+'</button>').join('')+'</div>';options.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{state[tab]=Number(b.dataset.index);apply();render();hint.textContent=palettes[tab][state[tab]][0]+' 아이템을 선택했어요. 다른 스타일과 조합해 보세요! ✨'}))}
function val(k,def){return state[k]===null?def:palettes[k][state[k]][1]}
function shade(hex,amt){let n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+amt)),g=Math.max(0,Math.min(255,((n>>8)&255)+amt)),b=Math.max(0,Math.min(255,(n&255)+amt));return '#'+(1<<24|r<<16|g<<8|b).toString(16).slice(1)}
function apply(){
 const lip=val('lip','#c86d83'),blush=val('blush','#ef9e9e'),eye=val('eye','#e8b5c9'),hair=val('hair','#68445a'),liner=val('liner','#674b55'),brow=val('brows','#684454'),lens=val('lens','#80604f'),cloth=val('cloth','#d98baa'),hl=val('highlight','#fff0c5');
 document.querySelector('#lips path').setAttribute('fill',lip);
 document.querySelectorAll('#avatar defs linearGradient#hair stop').forEach((s,i)=>s.setAttribute('stop-color',i?shade(hair,-25):hair));
 document.querySelectorAll('#avatar defs linearGradient#cloth stop').forEach((s,i)=>s.setAttribute('stop-color',i?shade(cloth,-24):cloth));
 document.getElementById('blush').innerHTML='<ellipse cx="119" cy="251" rx="22" ry="11" fill="'+blush+'" opacity=".48"/><ellipse cx="241" cy="251" rx="22" ry="11" fill="'+blush+'" opacity=".48"/>';
 document.getElementById('eyeshadow').innerHTML='<path d="M115 207Q138 187 161 207L157 218Q138 208 118 219Z M199 207Q222 187 245 207L242 219Q222 208 203 218Z" fill="'+eye+'" opacity=".82"/>';
 document.getElementById('liner').innerHTML='<path d="M115 214Q138 194 160 214L166 208Q160 220 157 219Q137 204 115 214ZM200 214Q222 194 244 214L250 208Q244 220 241 219Q221 204 200 214Z" fill="'+liner+'"/>';
 document.getElementById('lashes').innerHTML=state.lashes===null?'':'<path d="M117 211l-5 -7m12 3l-2 -8m12 5v-9m10 9l3 -8m56 8l-3 -8m13 8v-9m13 9l2 -8m10 8l5 -7" stroke="'+palettes.lashes[state.lashes][1]+'" stroke-width="2.4" stroke-linecap="round"/>';
 document.getElementById('brows').querySelectorAll('path').forEach(p=>p.setAttribute('stroke',brow));
 document.querySelectorAll('#eyes ellipse').forEach((e,i)=>{if(i<2)e.setAttribute('fill',lens)});
 document.getElementById('lens').innerHTML=state.lens===null?'':'<circle cx="139" cy="215" r="13" fill="none" stroke="'+lens+'" stroke-width="1.4" opacity=".8"/><circle cx="221" cy="215" r="13" fill="none" stroke="'+lens+'" stroke-width="1.4" opacity=".8"/>';
 document.getElementById('highlight').innerHTML=state.highlight===null?'':'<ellipse cx="123" cy="244" rx="12" ry="4" fill="'+hl+'" opacity=".65"/><ellipse cx="237" cy="244" rx="12" ry="4" fill="'+hl+'" opacity=".65"/><path d="M177 247l3 -8 3 8" stroke="'+hl+'" stroke-width="3" fill="none" stroke-linecap="round"/>';
 document.getElementById('accessory').innerHTML=state.accessory===null?'':'<circle cx="99" cy="242" r="5" fill="'+val('accessory','#f5e6dc')+'" stroke="#d6ad70"/><circle cx="261" cy="242" r="5" fill="'+val('accessory','#f5e6dc')+'" stroke="#d6ad70"/><path d="M88 135q-13 -15 0 -22q13 7 0 22q-13 -15 -25 -5q10 17 25 5" fill="'+val('accessory','#f5e6dc')+'" stroke="#c47c9b" stroke-width="1.5"/>';
 const nk=val('necklace','#d6ad70');document.getElementById('necklace').innerHTML='<path d="M145 347Q180 379 215 347" fill="none" stroke="'+nk+'" stroke-width="2.5"/><path d="M180 367L174 374L180 383L186 374Z" fill="'+nk+'" stroke="#c69c62"/>';
 document.getElementById('look-name').textContent=Object.values(state).every(v=>v===null)?'새로운 스타일을 골라봐요':'나만의 믹스 앤 매치 룩 💕';
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));
document.getElementById('reset').onclick=()=>{Object.keys(state).forEach(k=>state[k]=null);apply();render();hint.textContent='처음 모습으로 돌아왔어요. 새롭게 꾸며 볼까요? 🌷'};
document.getElementById('random').onclick=()=>{Object.keys(state).forEach(k=>state[k]=Math.floor(Math.random()*palettes[k].length));apply();render();hint.textContent='랜덤으로 메이크업과 패션을 조합했어요! 마음에 안 드는 아이템은 바꿔도 좋아요 🎲'};
document.getElementById('finish').onclick=()=>{hint.textContent='짜잔! 나만의 스타일 완성 🎉 멋진 조합이에요. 다른 아이템으로 또 꾸며 볼까요?';document.getElementById('look-name').textContent='✨ 오늘의 스타일 완성 ✨'};
render();apply();
</script></body></html>
