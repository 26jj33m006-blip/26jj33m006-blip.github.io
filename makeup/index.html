<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff0f5"><title>반짝 메이크업 스튜디오</title>
<style>
:root{--pink:#e98eae;--deep:#985875;--ink:#593d4c;--line:#f1dce5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 5%,#ffe2ed,transparent 30%),linear-gradient(135deg,#fff9f5,#fbeaf3);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}header{text-align:center;padding:28px 15px 15px}.eyebrow{font-size:11px;letter-spacing:3px;color:#bd7895;font-weight:800}h1{font-size:clamp(28px,5vw,42px);margin:8px 0;color:#9b5878}header p{margin:0;color:#987b89}main{max-width:1000px;margin:auto;padding:12px 16px 35px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#ffffffdf;border:1px solid white;border-radius:24px;padding:20px;box-shadow:0 14px 40px #b77b9418}.stage{min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#fff0f6,#fff9f2);position:relative;overflow:hidden}.stage:before,.stage:after{content:"✦";position:absolute;color:#efb2c8;font-size:24px}.stage:before{top:24px;left:28px}.stage:after{right:30px;bottom:28px}.stage-title{align-self:flex-start;font-size:13px;font-weight:800;color:#b47791}#avatar{width:min(100%,350px);height:auto;filter:drop-shadow(0 14px 10px #c38ba633)}.mood{font-size:13px;color:#a27d8e;margin-top:3px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}button{font:inherit;cursor:pointer;transition:.15s}button:hover{transform:translateY(-2px)}button:focus-visible{outline:3px solid #d77fa5;outline-offset:3px}.action{padding:10px 14px;border-radius:13px;background:white;border:1px solid var(--line);color:var(--deep);font-weight:700}.primary{background:linear-gradient(135deg,#ee9fbb,#d97fa4);color:white;border:0}.editor h2{font-size:20px;margin:2px 0 5px}.sub{font-size:13px;color:#a08793;margin:0 0 16px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:18px}.tab{padding:11px 4px;border-radius:12px;background:#fff3f7;color:#a36b84;font-size:13px;font-weight:800;border:1px solid transparent}.tab[aria-selected=true]{background:#e99bb7;color:white}.label{font-size:13px;font-weight:800;margin:16px 0 10px;color:#8f6177}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.choice{background:white;border:1px solid var(--line);border-radius:14px;padding:10px 4px;color:#755568;font-size:12px;min-height:72px}.swatch{display:block;width:29px;height:29px;border-radius:50%;margin:0 auto 6px;border:3px solid white;box-shadow:0 0 0 1px #ead6df}.choice[aria-pressed=true]{border:2px solid #df86a8;background:#fff5f8}.hint{margin-top:18px;padding:12px 14px;background:#fff5f8;border-radius:13px;color:#94657c;font-size:13px;line-height:1.5}footer{text-align:center;color:#b18b9d;font-size:12px;padding:0 15px 22px}@media(max-width:740px){main{grid-template-columns:1fr;padding:8px 12px 25px;gap:13px}.stage{min-height:420px}.panel{padding:16px}}@media(max-width:360px){.tabs{grid-template-columns:repeat(2,1fr)}.choices{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header><div class="eyebrow">✦ YOUR LITTLE BEAUTY PLAYGROUND ✦</div><h1>반짝 메이크업 스튜디오</h1><p>오늘의 주인공에게 어울리는 룩을 만들어 봐!</p></header>
<main><section class="panel stage" aria-label="메이크업 미리보기"><div class="stage-title">MY MAKEOVER ✨</div>
<svg id="avatar" viewBox="0 0 340 430" role="img" aria-label="메이크업을 꾸밀 수 있는 캐릭터">
<defs><linearGradient id="skin" x2="0" y2="1"><stop stop-color="#ffe0c9"/><stop offset="1" stop-color="#f4bfa8"/></linearGradient><linearGradient id="hair" x2="1" y2="1"><stop stop-color="#68445a"/><stop offset="1" stop-color="#3c2a3a"/></linearGradient></defs>
<ellipse cx="170" cy="410" rx="115" ry="17" fill="#e8cbd7" opacity=".55"/><path d="M75 176Q48 44 170 35Q292 40 265 185L270 300Q248 390 170 394Q92 390 70 300Z" fill="url(#hair)"/><path d="M102 260Q85 340 105 420L235 420Q255 340 238 260Z" fill="#f4b4c8"/><path d="M139 302V354Q170 383 201 354V302Z" fill="url(#skin)"/><path d="M89 177Q85 98 170 87Q255 98 251 177L240 270Q230 337 170 345Q110 337 100 270Z" fill="url(#skin)"/><path d="M88 180Q73 84 143 64Q215 38 258 125Q237 111 218 116Q165 132 121 109Q112 145 88 180Z" fill="url(#hair)"/><path d="M89 155Q57 190 83 250Q89 272 101 280L98 198Z M251 155Q283 190 257 250Q251 272 239 280L242 198Z" fill="#52374b"/><ellipse cx="86" cy="231" rx="12" ry="21" fill="#f1b9a5"/><ellipse cx="254" cy="231" rx="12" ry="21" fill="#f1b9a5"/><path d="M116 201Q139 187 157 201M183 201Q201 187 224 201" fill="none" stroke="#684454" stroke-width="5" stroke-linecap="round"/>
<g id="eyeshadow"></g><g id="eyes"><path d="M115 224Q136 208 158 224Q138 242 115 224ZM182 224Q204 208 225 224Q203 242 182 224Z" fill="#fff"/><ellipse cx="138" cy="224" rx="7" ry="9" fill="#765343"/><ellipse cx="203" cy="224" rx="7" ry="9" fill="#765343"/><circle cx="140" cy="221" r="2.5" fill="white"/><circle cx="205" cy="221" r="2.5" fill="white"/><path d="M114 222Q137 207 159 222M181 222Q204 207 226 222" fill="none" stroke="#5d3d4d" stroke-width="3" stroke-linecap="round"/></g><g id="blush"></g><path d="M170 230Q158 263 169 266Q178 269 183 261" fill="none" stroke="#d99d8c" stroke-width="3" stroke-linecap="round"/><g id="lips"><path d="M145 290Q158 278 170 286Q182 278 195 290Q183 310 170 307Q157 310 145 290Z" fill="#c86d83"/><path d="M151 291Q170 296 189 291" fill="none" stroke="#f3a4ad" stroke-width="2"/></g></svg>
<div class="mood" id="look-name">새로운 스타일을 골라봐요</div><div class="toolbar"><button class="action" id="random">🎲 랜덤 룩</button><button class="action" id="reset">↺ 처음으로</button><button class="action primary" id="finish">완성했어요! ✨</button></div></section>
<section class="panel editor"><h2>뷰티 아이템 고르기</h2><p class="sub">원하는 아이템을 눌러 캐릭터를 꾸며 보세요.</p><div class="tabs" role="tablist" aria-label="꾸미기 종류"><button class="tab" role="tab" aria-selected="true" data-tab="lip">💄 립</button><button class="tab" role="tab" aria-selected="false" data-tab="blush">🌸 블러셔</button><button class="tab" role="tab" aria-selected="false" data-tab="eye">👁️ 아이섀도</button><button class="tab" role="tab" aria-selected="false" data-tab="hair">🎀 헤어</button></div><div id="options"></div><div class="hint" id="hint" aria-live="polite">마음에 드는 컬러를 선택해 봐! 정답은 없으니 네 취향대로 완성하면 돼 💗</div></section></main><footer>MAKE YOUR OWN SPARKLE · 나만의 스타일을 즐겨봐요</footer>
<script>
const palettes={lip:[['체리 핑크','#d85d83'],['로즈','#b94e70'],['코랄','#ed826e'],['플럼','#98516f'],['피치','#ef9b91'],['베리','#bd4770'],['누드','#c9857e'],['라일락','#bd8eae']],blush:[['베이비 핑크','#f28fa8'],['살구','#f4a27e'],['로즈','#df7891'],['라벤더','#c39acb'],['피치','#f5b49c'],['코랄','#ed7e79'],['모브','#bd849e'],['소프트','#e9a9b3']],eye:[['샴페인','#e9c88d'],['핑크 펄','#e9a5c0'],['라벤더','#b995ca'],['브론즈','#ad765e'],['민트','#9bc9b9'],['로즈 골드','#d89a91'],['스카이','#9dbbdf'],['초코','#79566a']],hair:[['초코 브라운','#68445a'],['블랙','#302632'],['허니 브라운','#b47b50'],['로즈 브라운','#a96b7d'],['라벤더','#9a7aab'],['코퍼','#bc704f'],['애쉬','#88818c'],['핑크','#d88cae']]};
const state={lip:null,blush:null,eye:null,hair:null};const options=document.getElementById('options'),hint=document.getElementById('hint');let tab='lip';
function render(){document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));const names={lip:'립 컬러',blush:'블러셔 컬러',eye:'아이섀도 컬러',hair:'헤어 컬러'};options.innerHTML='<div class="label">'+names[tab]+' 선택</div><div class="choices">'+palettes[tab].map((v,i)=>'<button class="choice" data-index="'+i+'" aria-pressed="'+(state[tab]===i)+'"><span class="swatch" style="background:'+v[1]+'"></span>'+v[0]+'</button>').join('')+'</div>';options.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{state[tab]=Number(b.dataset.index);apply();render();hint.textContent=palettes[tab][state[tab]][0]+' 컬러를 골랐어요. 다른 아이템도 조합해 보세요! ✨'}))}
function shade(hex,amt){let n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+amt)),g=Math.max(0,Math.min(255,((n>>8)&255)+amt)),b=Math.max(0,Math.min(255,(n&255)+amt));return '#'+(1<<24|r<<16|g<<8|b).toString(16).slice(1)}
function apply(){const lip=state.lip===null?'#c86d83':palettes.lip[state.lip][1],blush=state.blush===null?'#ef9e9e':palettes.blush[state.blush][1],eye=state.eye===null?'#e8b5c9':palettes.eye[state.eye][1],hair=state.hair===null?'#68445a':palettes.hair[state.hair][1];document.querySelector('#lips path').setAttribute('fill',lip);document.querySelectorAll('#avatar defs linearGradient#hair stop').forEach((s,i)=>s.setAttribute('stop-color',i?shade(hair,-25):hair));document.getElementById('blush').innerHTML='<ellipse cx="112" cy="264" rx="20" ry="10" fill="'+blush+'" opacity=".48"/><ellipse cx="228" cy="264" rx="20" ry="10" fill="'+blush+'" opacity=".48"/>';document.getElementById('eyeshadow').innerHTML='<path d="M113 216Q137 198 160 216L157 224Q137 214 117 225Z M180 216Q203 198 227 216L223 225Q203 214 183 224Z" fill="'+eye+'" opacity=".78"/>';document.getElementById('look-name').textContent=Object.values(state).every(v=>v===null)?'새로운 스타일을 골라봐요':'나만의 믹스 앤 매치 룩 💕'}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));document.getElementById('reset').onclick=()=>{Object.keys(state).forEach(k=>state[k]=null);apply();render();hint.textContent='처음 모습으로 돌아왔어요. 새롭게 꾸며 볼까요? 🌷'};document.getElementById('random').onclick=()=>{Object.keys(state).forEach(k=>state[k]=Math.floor(Math.random()*palettes[k].length));apply();render();hint.textContent='랜덤으로 새로운 룩을 만들었어요! 마음에 안 드는 컬러는 바꿔도 좋아요 🎲'};document.getElementById('finish').onclick=()=>{hint.textContent='짜잔! 나만의 메이크업 완성 🎉 멋진 조합이에요. 다른 컬러로 또 만들어 볼까요?';document.getElementById('look-name').textContent='✨ 오늘의 메이크업 완성 ✨'};render();apply();
</script></body></html>
