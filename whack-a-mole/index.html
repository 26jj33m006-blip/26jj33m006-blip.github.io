<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7f4">
<title>농담곰 팡팡! | 미니 게임</title>
<style>
:root{--ink:#30332f;--muted:#858a80;--green:#78966e;--green-dark:#587650;--cream:#f7f7f4;--soil:#79583f;--soil-dark:#543c2d}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}button{font:inherit}
.page{width:min(920px,calc(100% - 28px));margin:auto;padding:30px 0 45px}header{text-align:center;margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--green-dark);font-weight:800}h1{font-size:clamp(32px,6vw,48px);margin:7px 0}.subtitle{color:var(--muted);margin:0;font-size:14px}
.game-card{background:#fff;border:1px solid #e8e8e2;border-radius:26px;padding:clamp(15px,4vw,30px);box-shadow:0 15px 40px #3333330b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.stat{background:#f3f4ef;border-radius:16px;padding:11px;text-align:center}.stat span{display:block;font-size:12px;color:var(--muted);font-weight:700}.stat strong{font-size:26px;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(9px,2vw,18px);max-width:620px;margin:auto}
.hole{position:relative;aspect-ratio:1.12;border:0;border-radius:22px;background:linear-gradient(#e9f0e3,#dce8d4);overflow:hidden;cursor:pointer;isolation:isolate;touch-action:manipulation}
.hole:focus-visible{outline:4px solid #e9c96f;outline-offset:3px}
.grass{position:absolute;z-index:4;left:0;right:0;bottom:0;height:25%;background:linear-gradient(#91ad78,#77945f);clip-path:polygon(0 32%,12% 20%,23% 36%,34% 15%,47% 35%,58% 17%,71% 34%,84% 14%,100% 31%,100% 100%,0 100%)}
.dirt{position:absolute;z-index:3;left:12%;right:12%;bottom:8%;height:27%;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#3e2d23 0 48%,#684a35 52% 70%,#98704c 73%);box-shadow:0 5px 0 #b28a60}
.mascot{position:absolute;z-index:2;left:50%;bottom:20%;width:66%;height:82%;transform:translate(-50%,115%);transition:transform .34s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.hole.active .mascot{transform:translate(-50%,0)}
.hole.hit .mascot{transform:translate(-50%,-7%) scale(.94)}
.bear-body{position:absolute;left:19%;right:19%;bottom:0;height:48%;background:#fff;border:2px solid #e6e5e1;border-radius:48% 48% 30% 30%;box-shadow:inset -5px -4px 0 #f0efeb}
.bear-head{position:absolute;left:0;top:0;width:100%;height:76%;background:#fff;border:2px solid #e6e5e1;border-radius:48% 48% 45% 45%;z-index:2;box-shadow:inset -5px -4px 0 #f4f3ef}
.ear{position:absolute;top:0;width:24%;aspect-ratio:1;border-radius:50%;background:#fff;border:2px solid #e6e5e1;z-index:1}.ear.left{left:3%}.ear.right{right:3%}
.eye{position:absolute;top:48%;width:4%;height:5%;border-radius:50%;background:#333}.eye.left{left:32%}.eye.right{right:32%}
.nose{position:absolute;top:59%;left:50%;width:5%;height:4%;transform:translateX(-50%);border-radius:50%;background:#333}
.mouth{position:absolute;top:63%;left:50%;width:7%;height:5%;transform:translateX(-50%);border-bottom:1.8px solid #444;border-radius:0 0 50% 50%}
.cheek{position:absolute;top:59%;width:11%;height:6%;border-radius:50%;background:#f5c9c7;opacity:.8}.cheek.left{left:15%}.cheek.right{right:15%}
.paw{position:absolute;z-index:3;top:55%;width:25%;height:22%;border-radius:50%;background:#fff;border:2px solid #e6e5e1}.paw.left{left:0;transform:rotate(22deg)}.paw.right{right:0;transform:rotate(-22deg)}
.hole .spark{position:absolute;z-index:5;top:8%;left:50%;transform:translateX(-50%);font-size:24px;opacity:0}.hole.hit .spark{animation:pop .5s ease forwards}
@keyframes pop{35%{opacity:1;transform:translate(-50%,-10px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-35px) scale(.8)}}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:999px;padding:13px 25px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.65;cursor:default}.primary{background:var(--green);color:white;box-shadow:0 4px 0 var(--green-dark)}.secondary{background:#f0f0e9;color:#60665b}.message{text-align:center;min-height:28px;margin:17px 0 0;color:var(--green-dark);font-size:14px;font-weight:700}.instructions{text-align:center;color:var(--muted);font-size:13px;line-height:1.7;margin:16px 0 0}footer{text-align:center;color:#a2a498;font-size:11px;margin-top:20px}
@media(max-width:480px){.page{padding-top:22px}.game-card{border-radius:21px}.hole{border-radius:16px}.stat{padding:9px 4px}.stat strong{font-size:22px}}
</style>
</head>
<body>
<main class="page">
<header><div class="eyebrow">CUTE ARCADE GAME</div><h1>🐻 농담곰 팡팡!</h1><p class="subtitle">땅속에 숨어 있다가 빼꼼! 농담곰이 빼꼼! 얼른 잡아 봐</p></header>
<section class="game-card" aria-label="농담곰 잡기 게임">
<div class="stats"><div class="stat"><span>점수</span><strong id="score">0</strong></div><div class="stat"><span>남은 시간</span><strong><b id="time">30</b><small>초</small></strong></div><div class="stat"><span>최고 점수</span><strong id="best">0</strong></div></div>
<div class="board" id="board">
<button class="hole" type="button" aria-label="1번 구멍">
<span class="mascot" aria-hidden="true"><span class="ear left"></span><span class="ear right"></span><span class="bear-body"></span><span class="bear-head"><i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="mouth"></i><i class="cheek left"></i><i class="cheek right"></i></span><span class="paw left"></span><span class="paw right"></span></span>
<span class="dirt"></span><span class="grass"></span><span class="spark">✨</span></button>\n<button class="hole" type="button" aria-label="2번 구멍">
<span class="mascot" aria-hidden="true"><span class="ear left"></span><span class="ear right"></span><span class="bear-body"></span><span class="bear-head"><i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="mouth"></i><i class="cheek left"></i><i class="cheek right"></i></span><span class="paw left"></span><span class="paw right"></span></span>
<span class="dirt"></span><span class="grass"></span><span class="spark">✨</span></button>\n<button class="hole" type="button" aria-label="3번 구멍">
<span class="mascot" aria-hidden="true"><span class="ear left"></span><span class="ear right"></span><span class="bear-body"></span><span class="bear-head"><i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="mouth"></i><i class="cheek left"></i><i class="cheek right"></i></span><span class="paw left"></span><span class="paw right"></span></span>
<span class="dirt"></span><span class="grass"></span><span class="spark">✨</span></button>\n<button class="hole" type="button" aria-label="4번 구멍">
<span class="mascot" aria-hidden="true"><span class="ear left"></span><span class="ear right"></span><span class="bear-body"></span><span class="bear-head"><i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="mouth"></i><i class="cheek left"></i><i class="cheek right"></i></span><span class="paw left"></span><span class="paw right"></span></span>
<span class="dirt"></span><span class="grass"></span><span class="spark">✨</span></button>\n<button class="hole" type="button" aria-label="5번 구멍">
<span class="mascot" aria-hidden="true"><span class="ear left"></span><span class="ear right"></span><span class="bear-body"></span><span class="bear-head"><i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="mouth"></i><i class="cheek left"></i><i class="cheek right"></i></span><span class="paw left"></span><span class="paw right"></span></span>
<span class="dirt"></span><span class="grass"></span><span class="spark">✨</span></button>\n<button class="hole" type="button" aria-label="6번 구멍">
<span class="mascot" aria-hidden="true"><span class="ear left"></span><span class="ear right"></span><span class="bear-body"></span><span class="bear-head"><i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="mouth"></i><i class="cheek left"></i><i class="cheek right"></i></span><span class="paw left"></span><span class="paw right"></span></span>
<span class="dirt"></span><span class="grass"></span><span class="spark">✨</span></button>\n<button class="hole" type="button" aria-label="7번 구멍">
<span class="mascot" aria-hidden="true"><span class="ear left"></span><span class="ear right"></span><span class="bear-body"></span><span class="bear-head"><i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="mouth"></i><i class="cheek left"></i><i class="cheek right"></i></span><span class="paw left"></span><span class="paw right"></span></span>
<span class="dirt"></span><span class="grass"></span><span class="spark">✨</span></button>\n<button class="hole" type="button" aria-label="8번 구멍">
<span class="mascot" aria-hidden="true"><span class="ear left"></span><span class="ear right"></span><span class="bear-body"></span><span class="bear-head"><i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="mouth"></i><i class="cheek left"></i><i class="cheek right"></i></span><span class="paw left"></span><span class="paw right"></span></span>
<span class="dirt"></span><span class="grass"></span><span class="spark">✨</span></button>\n<button class="hole" type="button" aria-label="9번 구멍">
<span class="mascot" aria-hidden="true"><span class="ear left"></span><span class="ear right"></span><span class="bear-body"></span><span class="bear-head"><i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="mouth"></i><i class="cheek left"></i><i class="cheek right"></i></span><span class="paw left"></span><span class="paw right"></span></span>
<span class="dirt"></span><span class="grass"></span><span class="spark">✨</span></button>
</div>
<div class="controls"><button class="btn primary" id="start">게임 시작!</button><button class="btn secondary" id="reset">점수 초기화</button></div>
<p class="message" id="message" role="status" aria-live="polite">시작 버튼을 누르면 30초 동안 게임이 진행돼!</p>
<p class="instructions">농담곰이 땅속에서 상체를 쑥 내밀면 빠르게 눌러 봐!<br>잡을 때마다 10점, 3콤보부터 보너스 점수!</p>
</section><footer>NAGANO BEAR ARCADE · HAVE A FUN DAY!</footer>
</main>
<script>
const holes=[...document.querySelectorAll('.hole')],scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),messageEl=document.getElementById('message'),startBtn=document.getElementById('start');
let score=0,time=30,best=Number(localStorage.getItem('bearBest')||0),playing=false,current=-1,spawnTimer=null,countdown=null,hideTimer=null,combo=0;
bestEl.textContent=best;
function clearTimers(){clearTimeout(spawnTimer);clearTimeout(hideTimer);clearInterval(countdown)}
function hideBear(){if(current>=0)holes[current].classList.remove('active');current=-1}
function scheduleBear(){if(!playing)return;hideBear();let next=Math.floor(Math.random()*holes.length);current=next;const hole=holes[next];hole.classList.remove('hit');hole.classList.add('active');const visible=Math.max(500,1050-Math.floor(score/40)*35);hideTimer=setTimeout(()=>{if(current===next){hideBear();combo=0}},visible);spawnTimer=setTimeout(scheduleBear,Math.max(620,1200-Math.floor(score/50)*35))}
function endGame(){playing=false;clearTimers();hideBear();if(score>best){best=score;localStorage.setItem('bearBest',String(best));bestEl.textContent=best;messageEl.textContent='🎉 최고 기록 달성! 정말 잘했어!'}else messageEl.textContent='게임 끝! '+score+'점을 얻었어. 다시 도전해 볼까?';startBtn.disabled=false;startBtn.textContent='다시 도전!'}
function startGame(){clearTimers();holes.forEach(h=>h.classList.remove('active','hit'));current=-1;score=0;time=30;combo=0;playing=true;scoreEl.textContent=0;timeEl.textContent=30;messageEl.textContent='농담곰을 잡아 봐!';startBtn.disabled=true;startBtn.textContent='게임 진행 중…';scheduleBear();countdown=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)endGame()},1000)}
holes.forEach((hole,index)=>hole.addEventListener('click',()=>{if(!playing||index!==current||!hole.classList.contains('active'))return;clearTimeout(hideTimer);hole.classList.remove('active');hole.classList.add('hit');current=-1;combo++;score+=10+(combo>=3?5:0);scoreEl.textContent=score;messageEl.textContent=combo>=3?'🔥 '+combo+'콤보! 보너스 점수!':'잘 잡았어! +10점'}));
startBtn.addEventListener('click',()=>{if(!playing)startGame()});
document.getElementById('reset').addEventListener('click',()=>{playing=false;clearTimers();current=-1;holes.forEach(h=>h.classList.remove('active','hit'));score=0;time=30;combo=0;best=0;scoreEl.textContent=0;timeEl.textContent=30;bestEl.textContent=0;localStorage.removeItem('bearBest');startBtn.disabled=false;startBtn.textContent='게임 시작!';messageEl.textContent='점수를 초기화했어. 다시 도전해 봐!'});
</script></body></html>
