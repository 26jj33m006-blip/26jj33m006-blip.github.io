<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7f4">
<title>농담곰 팡팡! | 미니 게임</title>
<style>
:root{--ink:#34342f;--muted:#85877f;--green:#78966e;--green-dark:#587650;--cream:#f7f7f4}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
button{font:inherit}
.page{width:min(920px,calc(100% - 28px));margin:auto;padding:30px 0 45px}
header{text-align:center;margin-bottom:22px}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--green-dark);font-weight:800}
h1{font-size:clamp(32px,6vw,48px);margin:7px 0}
.subtitle{color:var(--muted);margin:0;font-size:14px}
.game-card{background:#fff;border:1px solid #e8e8e2;border-radius:26px;padding:clamp(15px,4vw,30px);box-shadow:0 15px 40px #3333330b}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{background:#f3f4ef;border-radius:16px;padding:11px;text-align:center}
.stat span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.stat strong{font-size:26px;font-variant-numeric:tabular-nums}
.stat small{font-size:13px;margin-left:3px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(9px,2vw,18px);max-width:620px;margin:auto}
.hole{position:relative;aspect-ratio:1.12;border:0;border-radius:22px;background:linear-gradient(#e9f0e3,#dce8d4);overflow:hidden;cursor:pointer;isolation:isolate;touch-action:manipulation;padding:0}
.hole:focus-visible{outline:4px solid #e9c96f;outline-offset:3px}
.hole>*{pointer-events:none}
.mascot{position:absolute;z-index:2;left:50%;bottom:13%;width:76%;height:90%;transform:translate(-50%,115%);transition:transform .3s cubic-bezier(.2,.8,.2,1);pointer-events:none;display:block}
.hole.active .mascot{transform:translate(-50%,0)}
.hole.hit .mascot{transform:translate(-50%,-5%) scale(.94)}
.mascot img{display:block;width:100%;height:100%;object-fit:contain}
.dirt{position:absolute;z-index:3;left:10%;right:10%;bottom:7%;height:28%;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#3e2d23 0 48%,#684a35 52% 70%,#98704c 73%);box-shadow:0 5px 0 #b28a60;pointer-events:none}
.grass{position:absolute;z-index:4;left:0;right:0;bottom:0;height:25%;background:linear-gradient(#91ad78,#77945f);clip-path:polygon(0 32%,12% 20%,23% 36%,34% 15%,47% 35%,58% 17%,71% 34%,84% 14%,100% 31%,100% 100%,0 100%);pointer-events:none}
.spark{position:absolute;z-index:5;top:8%;left:50%;transform:translateX(-50%);font-size:24px;opacity:0;pointer-events:none}
.hole.hit .spark{animation:pop .5s ease forwards}
@keyframes pop{35%{opacity:1;transform:translate(-50%,-10px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-35px) scale(.8)}}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{border:0;border-radius:999px;padding:13px 25px;font-weight:800;cursor:pointer}
.btn:disabled{opacity:.65;cursor:default}
.primary{background:var(--green);color:white;box-shadow:0 4px 0 var(--green-dark)}
.secondary{background:#f0f0e9;color:#60665b}
.message{text-align:center;min-height:28px;margin:17px 0 0;color:var(--green-dark);font-size:14px;font-weight:700}
.instructions{text-align:center;color:var(--muted);font-size:13px;line-height:1.7;margin:16px 0 0}
footer{text-align:center;color:#a2a498;font-size:11px;margin-top:20px}
@media(max-width:480px){.page{padding-top:22px}.game-card{border-radius:21px}.hole{border-radius:16px}.stat{padding:9px 4px}.stat strong{font-size:22px}}
@media(prefers-reduced-motion:reduce){.mascot{transition:none}.hole.hit .spark{animation:none}}
</style>
</head>
<body>
<main class="page">
<header><div class="eyebrow">CUTE ARCADE GAME</div><h1>🐻 농담곰 팡팡!</h1><p class="subtitle">땅속에서 빼꼼 나타나는 농담곰을 잡아 봐!</p></header>
<section class="game-card" aria-label="농담곰 잡기 게임">
<div class="stats">
<div class="stat"><span>점수</span><strong id="score">0</strong></div>
<div class="stat"><span>남은 시간</span><strong><b id="time">60</b><small>초</small></strong></div>
<div class="stat"><span>최고 점수</span><strong id="best">0</strong></div>
</div>
<div class="board" id="board" aria-label="게임 구멍"></div>
<div class="controls"><button class="btn primary" id="start" type="button">게임 시작!</button><button class="btn secondary" id="reset" type="button">점수 초기화</button></div>
<p class="message" id="message" role="status" aria-live="polite">시작 버튼을 누르면 60초 동안 게임이 진행돼!</p>
<p class="instructions">농담곰이 땅 위로 쑥 올라오면 눌러 봐!<br>한 번 잡을 때마다 10점, 3콤보부터 보너스 5점!</p>
</section>
<footer>MINI BEAR ARCADE · HAVE A FUN DAY!</footer>
</main>
<script>
"use strict";
const board=document.getElementById("board");
const bearMarkup = `<span class="mascot" aria-hidden="true"><img src="assets/damgom.png" alt=""></span><span class="dirt" aria-hidden="true"></span><span class="grass" aria-hidden="true"></span><span class="spark" aria-hidden="true">✨</span>`;
board.innerHTML = Array.from({length:9},(_,i)=>`<button class="hole" type="button" aria-label="${i+1}번 구멍">${bearMarkup}</button>`).join("");
const holes=[...board.querySelectorAll(".hole")];
const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const bestEl=document.getElementById("best");
const messageEl=document.getElementById("message");
const startBtn=document.getElementById("start");
const resetBtn=document.getElementById("reset");
const GAME_SECONDS=60;
let score=0,time=GAME_SECONDS,best=0,combo=0,playing=false,current=-1;
let spawnTimer=null,hideTimer=null,countdownTimer=null;
try{best=Math.max(0,Number(localStorage.getItem("bearBest")||0)||0)}catch(error){best=0}
bestEl.textContent=String(best);

function clearTimers(){
 if(spawnTimer!==null){clearTimeout(spawnTimer);spawnTimer=null}
 if(hideTimer!==null){clearTimeout(hideTimer);hideTimer=null}
 if(countdownTimer!==null){clearInterval(countdownTimer);countdownTimer=null}
}
function hideCurrent(){
 if(current>=0) holes[current].classList.remove("active");
 current=-1;
}
function finishGame(){
 if(!playing)return;
 playing=false;clearTimers();hideCurrent();
 if(score>best){
  best=score;bestEl.textContent=String(best);
  try{localStorage.setItem("bearBest",String(best))}catch(error){}
  messageEl.textContent="🎉 최고 기록 달성! 정말 잘했어!";
 }else{
  messageEl.textContent="게임 끝! "+score+"점을 얻었어. 다시 도전해 볼까?";
 }
 startBtn.disabled=false;startBtn.textContent="다시 도전!";
}
function scheduleNext(delay=220){
 if(!playing)return;
 if(spawnTimer!==null)clearTimeout(spawnTimer);
 spawnTimer=setTimeout(()=>{spawnTimer=null;showNext()},delay);
}
function showNext(){
 if(!playing)return;
 hideCurrent();
 const next=Math.floor(Math.random()*holes.length);
 current=next;
 const hole=holes[next];
 hole.classList.remove("hit");
 hole.classList.add("active");
 const visibleMs=Math.max(900,1550-Math.floor(score/50)*25);
 if(hideTimer!==null)clearTimeout(hideTimer);
 hideTimer=setTimeout(()=>{
  hideTimer=null;
  if(!playing||current!==next)return;
  hideCurrent();combo=0;scheduleNext(180);
 },visibleMs);
}
function hitHole(index){
 if(!playing||index!==current)return;
 const hole=holes[index];
 if(!hole||!hole.classList.contains("active"))return;
 if(hideTimer!==null){clearTimeout(hideTimer);hideTimer=null}
 hole.classList.remove("active");
 hole.classList.add("hit");
 current=-1;
 combo++;
 const gained=10+(combo>=3?5:0);
 score+=gained;
 scoreEl.textContent=String(score);
 messageEl.textContent=combo>=3?"🔥 "+combo+"콤보! +"+gained+"점 보너스!":"성공! +10점";
 scheduleNext(240);
}
function startGame(){
 clearTimers();
 holes.forEach(h=>h.classList.remove("active","hit"));
 current=-1;score=0;time=GAME_SECONDS;combo=0;playing=true;
 scoreEl.textContent="0";timeEl.textContent=String(GAME_SECONDS);
 messageEl.textContent="담곰이를 눌러 봐!";
 startBtn.disabled=true;startBtn.textContent="게임 진행 중…";
 showNext();
 countdownTimer=setInterval(()=>{
  if(!playing)return;
  time=Math.max(0,time-1);
  timeEl.textContent=String(time);
  if(time===0)finishGame();
 },1000);
}
function resetGame(){
 playing=false;clearTimers();hideCurrent();
 holes.forEach(h=>h.classList.remove("active","hit"));
 score=0;time=GAME_SECONDS;combo=0;best=0;
 scoreEl.textContent="0";timeEl.textContent=String(GAME_SECONDS);bestEl.textContent="0";
 try{localStorage.removeItem("bearBest")}catch(error){}
 startBtn.disabled=false;startBtn.textContent="게임 시작!";
 messageEl.textContent="점수와 최고 기록을 초기화했어!";
}
// Pointer events register the hit immediately; click remains for keyboard activation.
holes.forEach((hole,index)=>{
 hole.addEventListener("pointerdown",event=>{
  if(event.button!==undefined&&event.button!==0)return;
  event.preventDefault();
  hitHole(index);
 });
 hole.addEventListener("click",event=>{
  if(event.detail===0)hitHole(index);
 });
});
startBtn.addEventListener("click",()=>{if(!playing)startGame()});
resetBtn.addEventListener("click",resetGame);
</script>
</body>
</html>
